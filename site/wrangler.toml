# Cloudflare Worker serving the static BulkTab site (no Worker script: static assets only).
# Deploy: npm run build && npx wrangler deploy   (CI: .github/workflows/site.yml)
name = "bulktab-site"
compatibility_date = "2026-11-24"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[routes]]
pattern = "bulktab.waukeganlabs.com"
custom_domain = true
