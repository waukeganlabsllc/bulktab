<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{metaTitle}}</title>
<meta name="description" content="{{metaDescription}}">
{{canonicalTag}}
{{robotsMeta}}
<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="BulkTab">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{metaDescription}}">
{{ogUrlTag}}
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="BulkTab: write a product tab once, show it on every matching product. Shown beside a real WooCommerce product page with a shoe size guide tab.">
{{articleMeta}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ogTitle}}">
<meta name="twitter:description" content="{{metaDescription}}">
<meta name="twitter:image" content="{{ogImage}}">
<meta name="theme-color" content="#1E3A5F">
<link rel="icon" href="/assets/img/bulktab-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="BulkTab Blog" href="/rss.xml">
<link rel="preload" href="/assets/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin="anonymous">
<link rel="preload" href="/assets/fonts/space-grotesk-latin-wght.woff2" as="font" type="font/woff2" crossorigin="anonymous">
<link rel="stylesheet" href="/assets/css/site.css?v={{cssVersion}}">
{{jsonld}}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{content}}
</main>
{{> footer}}
<script src="/assets/js/site.js?v={{jsVersion}}"></script>
{{bodyEnd}}
</body>
</html>
